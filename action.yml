name: "Podcast Generator by Vipin"
author: "Vipin"
description: "Generate a podcast feed from a YAML file"
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email:
    description: "The committer's email address"
    required: false
    default: "github-actions[bot]@users.noreply.github.com"
  name:
    description: "The committer's name"
    required: false
    default: "github-actions[bot]"
